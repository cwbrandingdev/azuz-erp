# fly.toml app configuration file generated for atria-backend-broken-night-9242 on 2026-08-17T16:05:23-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'atria-backend-broken-night-9242'
primary_region = 'gru'

[build]
[deploy]
  # Migrations run via docker-entrypoint.sh on app start (avoids extra release_command VM in GRU).
  seed_command = 'ts-node prisma/seed.ts'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
